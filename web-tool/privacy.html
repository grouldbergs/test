<body><main><a href="/web-tool/">返回月龄印章</a><h1>网页版服务与隐私说明</h1>
<p>网页版按已激活的邀请码调起对应印章。用于盖章的 Day 1 日期来自原激活记录。</p>
<p>选图、读取照片里的日期、叠加印章和导出成片都在浏览器中完成。原图和成片不会上传。验证时会发送兑换码。盖章时会发送兑换码、该张照片的日期和模板编号。服务器返回透明印章。</p>
<p>兑换码仅在当前网页运行期间使用。有关服务记录和资料请求，请参阅 TinyDays 的服务与隐私说明。</p>
