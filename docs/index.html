<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TinyDays</title>
  <style>
    :root {
      color-scheme: light;
      --fg: #1a1a1a;
      --muted: #555;
      --line: #ddd;
      --bg: #fafafa;
      --err: #a40000;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0 auto;
      max-width: 40rem;
      padding: 1.25rem 1rem 3rem;
      font: 16px/1.5 system-ui, -apple-system, sans-serif;
      color: var(--fg);
      background: #fff;
    }
    h1 { font-size: 1.35rem; margin: 0 0 0.35rem; }
    h2 { font-size: 0.85rem; margin: 0 0 0.5rem; color: var(--muted); font-weight: 600; }
    .lead { margin: 0 0 1.25rem; color: var(--muted); font-size: 0.95rem; }
    label { display: block; font-weight: 600; margin: 0 0 0.35rem; }
    .field { margin: 0 0 1rem; }
    input[type="date"], input[type="file"] {
      width: 100%;
      font: inherit;
      padding: 0.45rem 0.5rem;
    }
    button {
      display: inline-block;
      font: inherit;
      font-weight: 600;
      padding: 0.65rem 1rem;
      border: 0;
      border-radius: 8px;
      background: #1a1a1a;
      color: #fff;
      cursor: pointer;
    }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    .card {
      margin: 0 0 1.25rem;
      padding-top: 0.9rem;
      border-top: 1px solid var(--line);
    }
    .file-name { font-weight: 600; margin: 0 0 0.5rem; word-break: break-all; }
    .exif-line { margin: 0 0 0.75rem; }
    .day-line { font-size: 1.4rem; font-weight: 700; margin: 0 0 0.75rem; }
    .manual {
      margin: 0 0 1rem;
      padding: 0.75rem 0.85rem;
      background: #fff6e5;
      border-radius: 8px;
    }
    .manual p { margin: 0 0 0.6rem; }
    .card-error, #error { color: var(--err); margin: 0 0 0.75rem; }
    .pending { margin: 0 0 0.75rem; color: var(--muted); }
    .preview {
      display: block;
      width: 100%;
      height: auto;
      margin: 0.5rem 0;
      background: var(--bg);
    }
    .save-hint, .out-name, .note { margin: 0 0 0.6rem; color: var(--muted); font-size: 0.9rem; }
    .out-name { word-break: break-all; }
    #share-all { margin: 0 0 0.6rem; }
    #debug {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
    }
    #debug-body {
      margin: 0;
      padding: 0.75rem;
      background: var(--bg);
      border-radius: 8px;
      font-size: 0.75rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
    }
    #work { display: none; }
  </style>
</head>
<body>
  <h1>TinyDays</h1>
  <p class="lead">在手机本地给照片加上 DAY 水印，原图不会离开这台设备。</p>

  <div class="field">
    <label for="start-date">起始日</label>
    <input type="date" id="start-date" required>
  </div>

  <div class="field">
    <label for="photo" id="photo-label">选择照片</label>
    <input type="file" id="photo" accept="image/*" multiple>
  </div>

  <p id="error" hidden></p>
  <div id="cards"></div>

  <p id="share-note" class="note" hidden>只会打开系统分享，不会自动写入相册。</p>
  <p id="share-incomplete" class="note" hidden>还有照片没完成，这次分享不包括它们。</p>
  <button id="share-all" type="button" hidden>分享全部</button>
  <p id="share-fallback" class="note" hidden>这个浏览器不能一次分享多张。请逐张点「保存这张」，或长按图片。</p>

  <section id="debug">
    <h2>调试信息</h2>
    <pre id="debug-body">还没有选择照片。</pre>
  </section>

  <canvas id="work"></canvas>
  <script src="app.js?v=7387b909a7"></script>
</body>
</html>
